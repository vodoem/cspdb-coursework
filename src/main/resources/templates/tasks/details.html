<!DOCTYPE html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/header :: head('Карточка задачи')}"/>
<body><div th:replace="~{fragments/navbar :: navbar}"></div><main class="container py-4">
<div class="d-flex justify-content-between align-items-center mb-3"><h1 class="h3">Задача <span th:text="${task.number}"></span></h1><a class="btn btn-primary" th:href="@{/task-assignments/new}">Назначить сотрудника на задачу</a></div>
<div class="card shadow-sm mb-3"><div class="card-body"><p><strong>Название:</strong> <span th:text="${task.name}"></span></p><p><strong>Описание:</strong> <span th:text="${task.description}"></span></p><p><strong>Проект:</strong> <span th:text="${task.project.name}"></span></p><p><strong>Статус:</strong> <span th:text="${task.taskStatus.name}"></span></p><p><strong>Тип:</strong> <span th:text="${task.taskType.name}"></span></p><p><strong>Трудоемкость:</strong> план <span th:text="${task.plannedPayload}"></span>, факт <span th:text="${task.factPayload}"></span></p><p><strong>Даты:</strong> план до <span th:text="${task.plannedDateOfEnd}"></span>, факт до <span th:text="${task.factDateOfEnd}"></span></p></div></div>
<div class="card shadow-sm"><div class="card-header">Назначенные сотрудники</div><ul class="list-group list-group-flush"><li class="list-group-item" th:each="a : ${assignments}" th:text="${a.employee.fullName + ' — ' + a.status + ', план: ' + a.plannedPayload + ', факт: ' + a.factPayload}"></li></ul></div>
</main><div th:replace="~{fragments/footer :: footer}"></div></body></html>
