<!DOCTYPE html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/header :: head('Карточка сотрудника')}"/>
<body><div th:replace="~{fragments/navbar :: navbar}"></div><main class="container py-4"><h1 class="h3">Сотрудник: <span th:text="${employee.fullName}"></span></h1>
<div class="card shadow-sm mb-3"><div class="card-body"><p><strong>Логин:</strong> <span th:text="${employee.login}"></span></p><p><strong>Дата рождения:</strong> <span th:text="${employee.birthdate}"></span></p><p><strong>Должность:</strong> <span th:text="${employee.companyPosition.name}"></span></p></div></div>
<div class="row g-3"><div class="col-md-6"><div class="card shadow-sm"><div class="card-header">Проекты</div><ul class="list-group list-group-flush"><li class="list-group-item" th:each="a : ${projectAssignments}" th:text="${a.project.name + ' — ' + a.projectRole.name}"></li></ul></div></div>
<div class="col-md-6"><div class="card shadow-sm"><div class="card-header">Задачи</div><ul class="list-group list-group-flush"><li class="list-group-item" th:each="a : ${taskAssignments}" th:text="${a.task.number + ' ' + a.task.name + ' (' + a.status + ')'}"></li></ul></div></div></div>
</main><div th:replace="~{fragments/footer :: footer}"></div></body></html>
