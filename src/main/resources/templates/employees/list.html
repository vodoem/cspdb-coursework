<!DOCTYPE html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/header :: head('Сотрудники')}"/>
<body><div th:replace="~{fragments/navbar :: navbar}"></div><main class="container py-4"><h1 class="h3 mb-3">Список сотрудников</h1>
<div class="table-responsive bg-white shadow-sm rounded"><table class="table table-striped mb-0"><thead><tr><th>Логин</th><th>Имя</th><th>Фамилия</th><th>Должность</th><th>Дата рождения</th><th></th></tr></thead><tbody>
<tr th:each="e : ${employees}"><td th:text="${e.login}"></td><td th:text="${e.name}"></td><td th:text="${e.surname}"></td><td th:text="${e.companyPosition.name}"></td><td th:text="${e.birthdate}"></td><td><a class="btn btn-sm btn-outline-primary" th:href="@{/employees/{id}(id=${e.id})}">Открыть</a></td></tr>
</tbody></table></div></main><div th:replace="~{fragments/footer :: footer}"></div></body></html>
