<!DOCTYPE html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/header :: head('Назначение на задачу')}"/>
<body><div th:replace="~{fragments/navbar :: navbar}"></div><main class="container py-4"><h1 class="h3 mb-3">Назначить сотрудника на задачу</h1>
<div class="card shadow-sm"><div class="card-body"><div th:if="${dbError}" class="alert alert-danger" th:text="${dbError}"></div>
<form th:action="@{/task-assignments/new}" method="post" th:object="${taskAssignmentForm}">
<div class="mb-3"><label class="form-label">Сотрудник</label><select class="form-select" th:field="*{employeeId}"><option value="">Выберите...</option><option th:each="e : ${employees}" th:value="${e.id}" th:text="${e.fullName}"></option></select><div class="text-danger" th:errors="*{employeeId}"></div></div>
<div class="mb-3"><label class="form-label">Задача</label><select class="form-select" th:field="*{taskId}"><option value="">Выберите...</option><option th:each="t : ${tasks}" th:value="${t.id}" th:text="${t.number + ' - ' + t.name}"></option></select><div class="text-danger" th:errors="*{taskId}"></div></div>
<div class="mb-3"><label class="form-label">Статус</label><select class="form-select" th:field="*{status}"><option value="">Выберите...</option><option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"></option></select><div class="text-danger" th:errors="*{status}"></div></div>
<div class="mb-3"><label class="form-label">Плановая трудоемкость</label><input class="form-control" type="number" step="0.1" th:field="*{plannedPayload}"/><div class="text-danger" th:errors="*{plannedPayload}"></div></div>
<div class="mb-3"><label class="form-label">Фактическая трудоемкость</label><input class="form-control" type="number" step="0.1" th:field="*{factPayload}"/><div class="text-danger" th:errors="*{factPayload}"></div></div>
<button class="btn btn-primary" type="submit">Сохранить</button>
</form></div></div></main><div th:replace="~{fragments/footer :: footer}"></div></body></html>
