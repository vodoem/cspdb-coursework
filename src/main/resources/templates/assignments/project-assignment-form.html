<!DOCTYPE html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/header :: head('Назначение на проект')}"/>
<body><div th:replace="~{fragments/navbar :: navbar}"></div><main class="container py-4"><h1 class="h3 mb-3">Назначить сотрудника на проект</h1>
<div class="card shadow-sm"><div class="card-body">
<div th:if="${dbError}" class="alert alert-danger" th:text="${dbError}"></div>
<form th:action="@{/project-assignments/new}" method="post" th:object="${projectAssignmentForm}">
<div class="mb-3"><label class="form-label">Сотрудник</label><select class="form-select" th:field="*{employeeId}"><option value="">Выберите...</option><option th:each="e : ${employees}" th:value="${e.id}" th:text="${e.fullName + ' (' + e.login + ')'}"></option></select><div class="text-danger" th:errors="*{employeeId}"></div></div>
<div class="mb-3"><label class="form-label">Проект</label><select class="form-select" th:field="*{projectId}"><option value="">Выберите...</option><option th:each="p : ${projects}" th:value="${p.id}" th:text="${p.code + ' - ' + p.name}"></option></select><div class="text-danger" th:errors="*{projectId}"></div></div>
<div class="mb-3"><label class="form-label">Роль</label><select class="form-select" th:field="*{projectRoleName}"><option value="">Выберите...</option><option th:each="r : ${projectRoles}" th:value="${r.name}" th:text="${r.name}"></option></select><div class="text-danger" th:errors="*{projectRoleName}"></div></div>
<button class="btn btn-primary" type="submit">Сохранить</button>
</form></div></div></main><div th:replace="~{fragments/footer :: footer}"></div></body></html>
