<!DOCTYPE html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/header :: head('Отчет по трудоемкости проектов')}"/>
<body><div th:replace="~{fragments/navbar :: navbar}"></div><main class="container py-4"><h1 class="h3 mb-3">Проекты и трудоемкость</h1>
<div class="table-responsive bg-white shadow-sm rounded"><table class="table table-striped mb-0"><thead><tr><th>Код</th><th>Название</th><th>Статус</th><th>Ответственный</th><th>План</th><th>Факт</th></tr></thead><tbody><tr th:each="r : ${rows}"><td th:text="${r.code}"></td><td th:text="${r.name}"></td><td th:text="${r.status}"></td><td th:text="${r.responsibleEmployee.fullName}"></td><td th:text="${r.plannedPayload}"></td><td th:text="${r.factPayload}"></td></tr></tbody></table></div>
</main><div th:replace="~{fragments/footer :: footer}"></div></body></html>
