<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Проекты')}"/>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="container py-4">
    <h1 class="h3 mb-3">Список проектов</h1>
    <div class="table-responsive bg-white shadow-sm rounded">
        <table class="table table-striped mb-0">
            <thead><tr><th>Код</th><th>Название</th><th>Статус</th><th>Тип</th><th>Ответственный</th><th>План. трудоемкость</th><th>Факт. трудоемкость</th><th></th></tr></thead>
            <tbody>
            <tr th:each="p : ${projects}">
                <td th:text="${p.code}"></td><td th:text="${p.name}"></td><td th:text="${p.status}"></td>
                <td th:text="${p.projectType.name}"></td><td th:text="${p.responsibleEmployee.fullName}"></td>
                <td th:text="${p.plannedPayload}"></td><td th:text="${p.factPayload}"></td>
                <td><a class="btn btn-sm btn-outline-primary" th:href="@{/projects/{id}(id=${p.id})}">Открыть</a></td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div></body></html>
